<title>The Sea of Wonders · Kaevoryn Studios</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=>{
const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)return;
let w=0,h=0,dpr=1,raf=0,last=0;
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){
 const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.5);
 w=Math.max(1,r.width);h=Math.max(1,r.height);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);
resize();
function draw(ms){
 raf=requestAnimationFrame(draw);
 if(ms-last<32)return;last=ms;
 const t=reduced?0:ms*.00042;
 const horizon=h*.43;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#8bbdce');sky.addColorStop(.65,'#c5dfe0');sky.addColorStop(1,'#78adba');
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+2);
 const glow=ctx.createRadialGradient(w*.67,horizon*.04,2,w*.67,horizon*.04,w*.45);
 glow.addColorStop(0,'rgba(255,244,211,.46)');glow.addColorStop(1,'rgba(255,244,211,0)');
 ctx.fillStyle=glow;ctx.fillRect(0,0,w,horizon);
 let sea=ctx.createLinearGradient(0,horizon,0,h);
 sea.addColorStop(0,'#39889a');sea.addColorStop(.24,'#12647c');sea.addColorStop(.62,'#06445f');sea.addColorStop(1,'#022b46');
 ctx.fillStyle=sea;ctx.fillRect(0,horizon,w,h-horizon);
 // distant, low swells establish the horizon without a repeating stripe pattern
 for(let layer=0;layer<4;layer++){
  const y=horizon+10+layer*15,amp=2+layer*1.8,phase=t*(.6+layer*.12)+layer*1.7;
  ctx.beginPath();ctx.moveTo(0,y);
  for(let x=0;x<=w+8;x+=8){
   const yy=y+Math.sin(x*.009+phase)*amp+Math.sin(x*.021-phase*.7)*amp*.32;
   ctx.lineTo(x,yy);
  }
  ctx.strokeStyle=['rgba(220,244,239,.14)','rgba(174,222,224,.12)','rgba(7,63,83,.18)','rgba(190,230,228,.09)'][layer];
  ctx.lineWidth=layer===0?1.4:1;ctx.stroke();
 }
 // broad, soft sunlight path that breaks into irregular glints toward the viewer
 const sunX=w*(.67+Math.sin(t*.38)*.035);
 for(let i=0;i<155;i++){
  const depth=i/155,y=horizon+18+depth*depth*(h-horizon-18);
  const spread=5+depth*depth*w*.19;
  const x=sunX+(Math.sin(i*12.989+t*2.1)*.5)*spread;
  const len=(2+depth*12)*(0.35+Math.abs(Math.sin(i*7.13+t*3))*.8);
  const alpha=(.05+depth*.22)*(0.3+Math.abs(Math.sin(i*3.7+t*1.8))*.7);
  ctx.beginPath();ctx.moveTo(x-len,y);ctx.quadraticCurveTo(x,y-1-depth*1.5,x+len*.7,y);
  ctx.strokeStyle='rgba(255,239,196,'+alpha+')';ctx.lineWidth=.5+depth*1.1;ctx.stroke();
 }
 // broad moving swells with shaded faces, layered into the distance
 for(let layer=0;layer<11;layer++){
  const depth=layer/10,y=horizon+24+depth*depth*(h-horizon-16);
  const amp=3+depth*18,period=w*(.17+depth*.19),phase=t*(1.15+depth*1.2)+layer*2.07;
  const points=[];
  for(let x=-8;x<=w+8;x+=5){
   const primary=Math.sin(x/period*Math.PI*2+phase)*amp;
   const secondary=Math.sin(x/(period*.51)*Math.PI*2-phase*1.37)*amp*.24;
   const longRoll=Math.sin(x/(period*2.8)*Math.PI*2+phase*.72)*amp*.34;
   points.push([x,y+primary+secondary+longRoll]);
  }
  const thickness=3+depth*15;
  const face=ctx.createLinearGradient(0,y-thickness,0,y+thickness*2);
  face.addColorStop(0,'rgba(164,218,220,'+(.025+depth*.055)+')');
  face.addColorStop(.45,'rgba(8,83,105,'+(.035+depth*.12)+')');
  face.addColorStop(1,'rgba(1,35,57,'+(.05+depth*.13)+')');
  ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]-thickness);
  for(let p=1;p<points.length;p++)ctx.lineTo(points[p][0],points[p][1]-thickness);
  for(let p=points.length-1;p>=0;p--)ctx.lineTo(points[p][0],points[p][1]+thickness*1.5);
  ctx.closePath();ctx.fillStyle=face;ctx.fill();
  ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
  for(let p=1;p<points.length;p++)ctx.lineTo(points[p][0],points[p][1]);
  ctx.strokeStyle='rgba(190,232,230,'+(.045+depth*.15)+')';
  ctx.lineWidth=.65+depth*1.35;ctx.stroke();
 }
 // sparse, irregular crest foam, only on selected wave peaks
 for(let i=0;i<48;i++){
  const depth=(i%16)/15,y=horizon+42+depth*depth*(h-horizon-35);
  const x=((i*137.5+Math.sin(t*2.1+i)*58)% (w+40))-20;
  const wave=Math.sin(x*.012+t*2.1+i)* (3+depth*14);
  const len=2+depth*15;
  ctx.beginPath();ctx.moveTo(x-len,y+wave);
  ctx.quadraticCurveTo(x,y+wave-1-depth*2,x+len,y+wave);
  ctx.strokeStyle='rgba(231,246,239,'+(.06+depth*.16)+')';ctx.lineWidth=.6+depth*.9;ctx.stroke();
 }
 // subtle atmospheric horizon veil
 const veil=ctx.createLinearGradient(0,horizon-8,0,horizon+30);
 veil.addColorStop(0,'rgba(221,239,234,0)');veil.addColorStop(.55,'rgba(221,239,234,.17)');veil.addColorStop(1,'rgba(221,239,234,0)');
 ctx.fillStyle=veil;ctx.fillRect(0,horizon-8,w,38);
}
raf=requestAnimationFrame(draw);
})();
</script>
</body></html>
