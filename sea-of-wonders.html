<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=>{
 const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d',{alpha:false});
 if(!ctx)return;
 const surface=document.createElement('canvas'),sctx=surface.getContext('2d');
 let w=0,h=0,dpr=1,frame,pixels,last=0;
 function resize(){
  const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,1.25);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  surface.width=Math.max(180,Math.round(w*.58));surface.height=Math.max(190,Math.round(h*.58));
  frame=sctx.createImageData(surface.width,surface.height);pixels=frame.data;
 }
 if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);
 resize();
 // One connected ocean surface: intersecting long swells, not separate wave bands.
 function heightAt(x,z,t){
  return 1.35*Math.sin(x*.010+z*.020+t*.72)
   +.82*Math.sin(x*.016-z*.012-t*.56+.8)
   +.62*Math.sin(x*.006+z*.031+t*.43+2.1)
   +.22*Math.sin(x*.031+z*.009-t*1.18+1.7)
   +.12*Math.sin(x*.052-z*.024+t*1.55);
 }
 function render(ms){
  requestAnimationFrame(render);if(ms-last<34)return;last=ms;
  const t=ms*.001,sw=surface.width,sh=surface.height,horizon=h*.425;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#789eae');sky.addColorStop(.68,'#c0d5d5');sky.addColorStop(1,'#d4ded9');
  ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+1);
  const glow=ctx.createRadialGradient(w*.69,horizon*.12,1,w*.69,horizon*.12,w*.38);
  glow.addColorStop(0,'rgba(255,240,211,.35)');glow.addColorStop(1,'rgba(255,240,211,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,w,horizon);
  for(let py=0;py<sh;py++){
   const depth=py/(sh-1),z=depth*215;
   for(let px=0;px<sw;px++){
    const x=(px/sw-.5)*w*1.65,scale=.32+depth*1.8,xx=x*scale;
    const v=heightAt(xx,z,t);
    const dx=(heightAt(xx+2,z,t)-heightAt(xx-2,z,t))*.25;
    const dz=(heightAt(xx,z+2,t)-heightAt(xx,z-2,t))*.25;
    const curvature=heightAt(xx+4,z,t)+heightAt(xx-4,z,t)+heightAt(xx,z+4,t)+heightAt(xx,z-4,t)-4*v;
    const nx=-dx*2.5,ny=-dz*2.2,nz=1,inv=1/Math.sqrt(nx*nx+ny*ny+nz*nz);
    const diffuse=Math.max(0,(nx*.22+ny*-.58+nz*.78)*inv);
    const spec=Math.pow(Math.max(0,(nx*.32+ny*-.7+nz*.64)*inv),34);
    const crest=Math.max(0,v-(1.55+depth*.12));
    const breaking=Math.max(0,curvature*.22+Math.max(0,dx)*.2-.13);
    const foam=Math.min(.8,crest*.12+breaking*.32)*Math.min(1,depth*1.6);
    const worldX=px/sw*w,sunWidth=w*(.018+depth*.15);
    const sunTrack=Math.exp(-Math.pow((worldX-w*.69)/(sunWidth||1),2));
    const sparkle=.35+.65*Math.max(0,Math.sin(xx*.074+z*.12+t*2.1));
    const reflection=sunTrack*sparkle*(.1+depth*.3)*(spec*2+.12);
    const grain=(Math.sin(px*13.7+py*8.3+t*2)*Math.sin(px*5.1-py*11.4-t*1.4))*.018*depth;
    const light=(diffuse-.38)*30+spec*155+reflection*130+grain*255;
    const idx=(py*sw+px)*4;
    pixels[idx]=Math.max(0,Math.min(255,5+depth*5+light*.2+foam*185));
    pixels[idx+1]=Math.max(0,Math.min(255,38-depth*12+light*.68+foam*207));
    pixels[idx+2]=Math.max(0,Math.min(255,57-depth*10+light+foam*218));
    pixels[idx+3]=255;
   }
  }
  sctx.putImageData(frame,0,0);ctx.imageSmoothingEnabled=true;
  ctx.drawImage(surface,0,horizon,w,h-horizon);
  // Foam fragments follow individual steep crests on the same surface.
  for(let i=0;i<170;i++){
   const depth=(i%17)/17,y=horizon+depth*depth*(h-horizon-8);
   const x=((i*91.7+t*(8+depth*20))%(w+60))-30;
   const xx=(x/w-.5)*w*1.65*(.32+depth*1.8),z=depth*215,v=heightAt(xx,z,t);
   const slope=(heightAt(xx+3,z,t)-heightAt(xx-3,z,t))*.5;
   if(v<1.7+depth*.1||slope<.12)continue;
   const size=1+depth*7;
   ctx.beginPath();ctx.moveTo(x-size,y);ctx.quadraticCurveTo(x,y-1-depth*2,x+size*1.4,y+.4);
   ctx.strokeStyle='rgba(229,247,242,'+(.08+depth*.2)+')';ctx.lineWidth=.6+depth*.8;ctx.stroke();
  }
 }
 requestAnimationFrame(render);
})();
</script>
