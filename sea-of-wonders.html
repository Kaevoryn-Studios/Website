<!doctype html>

<title>The Sea of Wonders · Kaevoryn Studios</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#087b91;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.scene{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;background:linear-gradient(#79c5d4 0%,#f5c6a0 34%,#8bd5d0 50%,#087b91 100%)}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#082b3c88,transparent)}
.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:#fff;text-decoration:none;text-shadow:0 2px 12px #003b4b}
.brand small{display:block;color:#e1ffff;font-size:9px;margin-top:4px}
.top a:last-child{color:#fff;text-decoration:none;font-size:12px;text-shadow:0 2px 8px #003b4b}
.caption{position:absolute;z-index:2;top:12%;left:0;right:0;text-align:center;padding:0 18px;text-shadow:0 2px 18px #124b58aa;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.3em;font-weight:800;color:#fff5e8}
h1{font-size:clamp(34px,6vw,70px);letter-spacing:.12em;margin:14px 0 8px;font-weight:700}
.caption p{font-size:clamp(12px,1.6vw,16px);letter-spacing:.04em;margin:0;color:#fff8ef}
.footer{position:absolute;z-index:3;bottom:15px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.18em;text-shadow:0 2px 10px #003b4b}
.footer a{color:#fff;text-decoration:none}
.wave{animation:wave 18s linear infinite}
.wave.two{animation-duration:25s;animation-direction:reverse}
.glint{animation:glint 4s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-100px)}}
@keyframes glint{from{opacity:.18}to{opacity:.62}}
@media(max-width:650px){.top{padding:14px}.brand{font-size:9px}.brand small{font-size:8px}.top a:last-child{font-size:10px}.caption{top:15%}.caption p{max-width:300px;margin:auto;line-height:1.5}.footer{font-size:9px}}
@media(prefers-reduced-motion:reduce){.wave,.glint{animation:none}}
</style>
</head>
