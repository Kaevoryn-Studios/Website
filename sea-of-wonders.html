<title>The Sea of Wonders · Kaevoryn Studios</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=> {
const canvas=document.getElementById('ocean');
const ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)return;
let w=0,h=0,dpr=1,last=0,particles=[];
function resize(){
 const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);
 dpr=Math.min(window.devicePixelRatio||1,1.5);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 particles=[];
}
if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);
else window.addEventListener('resize',resize);
resize();
const layers=[
 {base:.455,amp:.025,len:1.25,speed:.00020,phase:1.1,deep:'#17647a',light:'#5b9ba6'},
 {base:.535,amp:.052,len:1.65,speed:.00031,phase:2.8,deep:'#07516c',light:'#347f91'},
 {base:.665,amp:.092,len:2.0,speed:.00039,phase:4.2,deep:'#043d59',light:'#176b83'},
 {base:.825,amp:.125,len:2.35,speed:.00047,phase:5.5,deep:'#022b43',light:'#10566e'}
];
function crestY(layer,x,t){
 const p=(x/w)*Math.PI*2*layer.len-t*layer.speed*1000+layer.phase;
 const broad=Math.sin(p)+.23*Math.sin(p*2.07+1.1)+.08*Math.sin(p*3.8-1.7);
 return h*layer.base-h*layer.amp*broad;
}
function drawWave(layer,index,t){
 const base=crestY(layer,0,t);
 const grad=ctx.createLinearGradient(0,h*layer.base-h*layer.amp*1.5,0,h);
 grad.addColorStop(0,layer.light);grad.addColorStop(.18,layer.deep);grad.addColorStop(1,index>1?'#001c30':'#064158');
 ctx.beginPath();ctx.moveTo(0,h);
 for(let x=0;x<=w+8;x+=5)ctx.lineTo(x,crestY(layer,x,t));
 ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
 // Soft reflected light on the curved shoulder of each swell.
 ctx.beginPath();
 for(let x=0;x<=w+8;x+=7){
  const y=crestY(layer,x,t)+h*(.018+index*.009);
  if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle='rgba(119,202,211,'+(0.13-index*.018)+')';
 ctx.lineWidth=2+index*.8;ctx.stroke();
 // Broken, wind-torn foam along selected steep crests.
 for(let x=-20;x<w+30;x+=7+index*2){
  const p=(x/w)*Math.PI*2*layer.len-t*layer.speed*1000+layer.phase;
  const slope=Math.cos(p)+.45*Math.cos(p*2.07+1.1);
  if(slope<.72 || Math.sin(p*1.7+index)<-.15)continue;
  const y=crestY(layer,x,t);
  const strength=Math.min(1,(slope-.65)*.8);
  ctx.beginPath();ctx.moveTo(x-3,y+1);
  ctx.quadraticCurveTo(x+1,y-2-index,y+5,y+1);
  ctx.strokeStyle='rgba(229,249,245,'+(strength*(.12+index*.055))+')';
  ctx.lineWidth=.7+index*.35;ctx.stroke();
 }
 // Curling, breaking sections: irregular white lip and short spray.
 const count=2+index;
 for(let k=0;k<count;k++){
  const x=((k*173+t*(.025+index*.012)+layer.phase*91)%(w+100))-50;
  const p=(x/w)*Math.PI*2*layer.len-t*layer.speed*1000+layer.phase;
  const slope=Math.cos(p)+.45*Math.cos(p*2.07+1.1);
  if(slope<.45)continue;
  const y=crestY(layer,x,t);
  const size=5+index*5;
  ctx.beginPath();ctx.moveTo(x-size*1.7,y+1);
  ctx.bezierCurveTo(x-size*.5,y-size*.8,x+size*.45,y-size*.45,x+size*1.3,y+size*.2);
  ctx.bezierCurveTo(x+size*.35,y-size*.12,x-size*.25,y+size*.35,x-size*1.7,y+1);
  ctx.fillStyle='rgba(222,246,243,'+(0.18+index*.09)+')';ctx.fill();
  for(let n=0;n<3+index;n++){
   const sx=x+Math.sin(n*9.1+k)*size*1.4;
   const sy=y-size*(.25+((n*7+k)%5)*.16);
   ctx.beginPath();ctx.arc(sx,sy,.6+((n+k)%3)*.35,0,Math.PI*2);
   ctx.fillStyle='rgba(224,247,244,.34)';ctx.fill();
  }
 }
}
function draw(ms){
 requestAnimationFrame(draw);if(ms-last<32)return;last=ms;
 const t=ms*.001;
 const horizon=h*.435;
 const sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#789eae');sky.addColorStop(.72,'#c0d4d2');sky.addColorStop(1,'#d5ded5');
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+2);
 const sun=ctx.createRadialGradient(w*.69,horizon*.1,1,w*.69,horizon*.1,w*.4);
 sun.addColorStop(0,'rgba(255,239,205,.36)');sun.addColorStop(1,'rgba(255,239,205,0)');
 ctx.fillStyle=sun;ctx.fillRect(0,0,w,horizon);
 // Distant, tightly packed ocean before the larger foreground swells.
 const far=ctx.createLinearGradient(0,horizon,0,h*.62);
 far.addColorStop(0,'#477f8c');far.addColorStop(1,'#0a4b65');
 ctx.fillStyle=far;ctx.fillRect(0,horizon,w,h-horizon);
 for(let i=0;i<layers.length;i++)drawWave(layers[i],i,t);
 // Fine wind texture and glints drift across the foreground surface.
 for(let i=0;i<85;i++){
  const depth=(i%17)/17;
  const x=((i*83+t*(18+depth*35))%(w+40))-20;
  const y=h*(.58+depth*.39)+Math.sin(i*4.7+t*1.4)*5;
  const len=2+depth*13;
  ctx.beginPath();ctx.moveTo(x-len,y);ctx.quadraticCurveTo(x,y-1,x+len,y);
  ctx.strokeStyle='rgba(171,220,219,'+(.035+depth*.075)+')';ctx.lineWidth=.6+depth*.7;ctx.stroke();
 }
}
requestAnimationFrame(draw);
})();
</script>
</body></html>
