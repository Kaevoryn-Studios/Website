<script>
(()=>{
 const canvas=document.getElementById('ocean');
 const gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'high-performance'});
 if(!gl){
  canvas.style.background='linear-gradient(180deg,#9bcbd8 0%,#4b9caf 42%,#08718b 68%,#033d58 100%)';
  return;
 }
 const vertex=`
 attribute vec2 position;
 varying vec2 uv;
 void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}
 `;
 const fragment=`
 precision highp float;
 varying vec2 uv;
 uniform vec2 resolution;
 uniform float time;

 float wave(vec2 p,vec2 d,float f,float a,float speed,float t){
   float q=dot(p,d)*f-t*speed;
   return a*(0.78*sin(q)+0.22*sin(2.0*q+0.8));
 }
 float ocean(vec2 p,float t){
   float h=0.0;
   h+=wave(p,normalize(vec2(1.0,0.18)),0.34,0.54,0.62,t);
   h+=wave(p,normalize(vec2(0.62,-0.78)),0.48,0.39,0.53,t);
   h+=wave(p,normalize(vec2(-0.32,-1.0)),0.67,0.25,0.73,t);
   h+=wave(p,normalize(vec2(0.92,0.42)),0.92,0.13,0.91,t);
   h+=wave(p,normalize(vec2(-0.78,0.36)),1.38,0.065,1.17,t);
   h+=wave(p,normalize(vec2(0.18,-1.0)),2.15,0.026,1.48,t);
   return h;
 }
 vec3 skyColor(vec3 rd){
   float y=max(rd.y,0.0);
   vec3 sky=mix(vec3(0.78,0.86,0.88),vec3(0.28,0.54,0.67),pow(y,0.72));
   vec3 sunDir=normalize(vec3(-0.48,0.34,-0.82));
   float sun=pow(max(dot(rd,sunDir),0.0),190.0);
   float halo=pow(max(dot(rd,sunDir),0.0),14.0);
   return sky+vec3(1.0,0.84,0.67)*sun+vec3(1.0,0.78,0.59)*halo*0.14;
 }
 void main(){
   vec2 screen=(gl_FragCoord.xy-0.5*resolution)/resolution.y;
   vec3 ro=vec3(0.0,1.12,4.6);
   vec3 rd=normalize(vec3(screen.x*1.34,screen.y*0.96-0.13,-1.62));
   if(rd.y>=-0.006){gl_FragColor=vec4(skyColor(rd),1.0);return;}

   float lo=0.0,hi=180.0;
   for(int i=0;i<30;i++){
     float mid=(lo+hi)*0.5;
     vec3 q=ro+rd*mid;
     if(q.y-ocean(q.xz,time)>0.0)lo=mid;else hi=mid;
   }
   float dist=(lo+hi)*0.5;
   vec3 pos=ro+rd*dist;
   float eps=0.018+dist*0.00035;
   float h=ocean(pos.xz,time);
   float dx=ocean(pos.xz+vec2(eps,0.0),time)-ocean(pos.xz-vec2(eps,0.0),time);
   float dz=ocean(pos.xz+vec2(0.0,eps),time)-ocean(pos.xz-vec2(0.0,eps),time);
   vec3 n=normalize(vec3(-dx/(2.0*eps),1.0,-dz/(2.0*eps)));
   vec3 light=normalize(vec3(-0.48,0.76,0.42));
   vec3 v=normalize(ro-pos);
   float ndl=max(dot(n,light),0.0);
   float fresnel=pow(1.0-max(dot(n,v),0.0),5.0);
   float spec=pow(max(dot(reflect(-light,n),v),0.0),110.0);

   float farFade=smoothstep(18.0,135.0,dist);
   vec3 water=mix(vec3(0.012,0.20,0.27),vec3(0.004,0.065,0.12),farFade*0.84);
   water*=0.48+0.76*ndl;
   float face=dot(n,light);
   water*=0.66+0.48*smoothstep(-0.48,0.68,face);

   // Fine wind ripples disturb the reflection without turning the sea into static.
   float ripple=sin(pos.x*10.5+pos.z*2.4-time*2.0);
   float rippleSoft=0.5+0.5*cos(pos.x*17.0+pos.z*3.1-time*2.8);
   water+=vec3(0.012,0.027,0.032)*(0.5+0.5*ripple)*rippleSoft*(1.0-farFade);
   water+=vec3(0.12,0.25,0.28)*spec*1.3;
   water=mix(water,skyColor(reflect(-v,n)),fresnel*0.52);

   // Small broken whitecaps appear only on steep upper shoulders of nearby swells.
   float slope=length(vec2(dx,dz))/(2.0*eps);
   float crest=smoothstep(0.52,1.05,slope);
   float crestPattern=sin(pos.x*1.25+pos.z*2.35-time*0.24);
   float brokenEdges=smoothstep(-0.15,0.62,crestPattern);
   float whitecap=crest*brokenEdges*(1.0-farFade);
   float foamGrain=0.92+0.08*sin(pos.x*19.0+pos.z*5.0-time*1.4);
   water=mix(water,vec3(0.72,0.85,0.86),clamp(whitecap*foamGrain,0.0,0.48));

   float sunGlint=pow(max(dot(reflect(-light,n),v),0.0),190.0);
   water+=vec3(1.0,0.88,0.72)*sunGlint*0.72;
   water=mix(water,vec3(0.34,0.55,0.61),farFade*0.55);
   gl_FragColor=vec4(water,1.0);
 }

 function shader(type,src){
  const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(sh));return null;}return sh;
 }
 const vs=shader(gl.VERTEX_SHADER,vertex),fs=shader(gl.FRAGMENT_SHADER,fragment);
 if(!vs||!fs){gl.clearColor(0.015,0.22,0.30,1.0);gl.clear(gl.COLOR_BUFFER_BIT);canvas.style.background='linear-gradient(180deg,#9bcbd8 0%,#4b9caf 42%,#08718b 68%,#033d58 100%)';return;}
 const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(program));gl.clearColor(0.015,0.22,0.30,1.0);gl.clear(gl.COLOR_BUFFER_BIT);canvas.style.background='linear-gradient(180deg,#9bcbd8 0%,#4b9caf 42%,#08718b 68%,#033d58 100%)';return;}
 gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const res=gl.getUniformLocation(program,'resolution'),tm=gl.getUniformLocation(program,'time');
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){
  const d=Math.min(window.devicePixelRatio||1,1.5),w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);
  canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(res,canvas.width,canvas.height);
 }
 if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);
 resize();
 let start=performance.now();
 function draw(now){
  gl.uniform1f(tm,reduce?0:(now-start)*.00032);
  gl.clearColor(0.015,0.22,0.30,1.0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
