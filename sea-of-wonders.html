<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=> {
const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)return;
const water=document.createElement('canvas'),wctx=water.getContext('2d');
let w=0,h=0,dpr=1,frame,pixels,last=0;
function resize(){
 const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);
 dpr=Math.min(window.devicePixelRatio||1,1.5);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 water.width=Math.max(220,Math.round(w*.72));water.height=Math.max(220,Math.round(h*.72));
 frame=wctx.createImageData(water.width,water.height);pixels=frame.data;
}
new ResizeObserver(resize).observe(canvas);resize();
function wave(x,z,t){
 const a=Math.sin(x*.010+z*.020+t*.78)*1.15;
 const b=Math.sin(x*.017-z*.014-t*.58)*.58;
 const c=Math.sin(x*.006+z*.038+t*.46)*.72;
 const d=Math.sin(x*.032+z*.011-t*1.12)*.20;
 const e=Math.sin(x*.052-z*.027+t*1.5)*.09;
 return a+b+c+d+e;
}
function draw(ms){
 requestAnimationFrame(draw);if(ms-last<30)return;last=ms;
 const t=ms*.001,ww=water.width,wh=water.height,horizon=h*.425;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#8eb9c8');sky.addColorStop(.7,'#d2e2df');sky.addColorStop(1,'#9bbfc4');
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+1);
 const haze=ctx.createRadialGradient(w*.68,horizon*.15,1,w*.68,horizon*.15,w*.43);
 haze.addColorStop(0,'rgba(255,245,218,.42)');haze.addColorStop(1,'rgba(255,245,218,0)');
 ctx.fillStyle=haze;ctx.fillRect(0,0,w,horizon);
 const sunX=w*.68;
 for(let py=0;py<wh;py++){
  const depth=py/(wh-1),z=depth*170;
  for(let px=0;px<ww;px++){
   const x=(px/ww-.5)*w*1.55;
   const scale=.38+depth*1.85;
   const xx=x*scale;
   const v=wave(xx,z,t);
   const dx=(wave(xx+2,z,t)-wave(xx-2,z,t))*.25;
   const dz=(wave(xx,z+2,t)-wave(xx,z-2,t))*.25;
   const nx=-dx*1.45,ny=-dz*1.8,nz=1;
   const inv=1/Math.sqrt(nx*nx+ny*ny+nz*nz);
   const diffuse=Math.max(0,(nx*.22+ny*-.55+nz*.81)*inv);
   const spec=Math.pow(Math.max(0,(nx*.34+ny*-.66+nz*.67)*inv),42);
   const crest=Math.max(0,v-(1.45+depth*.22));
   const foam=Math.min(.7,crest*.22)*Math.min(1,depth*1.7);
   const worldX=px/ww*w;
   const sunSpread=w*(.012+depth*.17);
   const sunTrack=Math.exp(-Math.pow((worldX-sunX)/(sunSpread||1),2));
   const broken=(.35+.65*Math.max(0,Math.sin(xx*.085+z*.11+t*2.3)));
   const reflection=sunTrack*broken*(.08+depth*.32)*(spec*2.2+.15);
   const rough=(Math.sin(px*17.3+py*8.1+t*2.4)*Math.sin(px*4.7-py*13.2-t*1.7))*.025*depth;
   const shade=(diffuse-.42)*23+spec*145+reflection*125+rough*255;
   const deep=depth;
   const idx=(py*ww+px)*4;
   pixels[idx]=Math.max(0,Math.min(255,7+deep*5+shade*.22+foam*178));
   pixels[idx+1]=Math.max(0,Math.min(255,47-deep*14+shade*.68+foam*205));
   pixels[idx+2]=Math.max(0,Math.min(255,68-deep*13+shade+foam*215));
   pixels[idx+3]=255;
  }
 }
 wctx.putImageData(frame,0,0);
 ctx.imageSmoothingEnabled=true;ctx.drawImage(water,0,horizon,w,h-horizon);
 // Small irregular whitecaps appear only on the highest moving crests.
 for(let i=0;i<150;i++){
  const depth=(i%25)/24,y=horizon+14+depth*depth*(h-horizon-14);
  const drift=t*(12+depth*24),x=((i*79.7+drift*4)%(w+50))-25;
  const local=wave((x-w*.5)*(.38+depth*1.85),depth*170,t);
  if(local<1.35+depth*.2)continue;
  const len=1+depth*7+(local-1.35)*2;
  ctx.beginPath();ctx.moveTo(x-len,y);
  ctx.quadraticCurveTo(x,y-1-depth*2,x+len,y+.2);
  ctx.strokeStyle='rgba(230,249,246,'+(.07+depth*.18)+')';
  ctx.lineWidth=.5+depth*.8;ctx.stroke();
 }
}
requestAnimationFrame(draw);
})();
</script>
</body></html>
