<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=>{
 const canvas=document.getElementById('ocean');
 const gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'high-performance'});
 if(!gl){
  const c=canvas.getContext('2d');if(c){c.fillStyle='#07506b';c.fillRect(0,0,canvas.width,canvas.height);}
  return;
 }
 const vertex=`
 attribute vec2 position;
 varying vec2 uv;
 void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}
 `;
 const fragment=`
 precision highp float;
 varying vec2 uv;
 uniform vec2 resolution;
 uniform float time;
 const float PI=3.14159265;
 float wave(vec2 p,vec2 d,float f,float a,float s,float t){
  float q=dot(p,d)*f+t*s;
  return a*(sin(q)+.20*sin(2.0*q));
 }
 float ocean(vec2 p,float t){
  float h=0.;
  h+=wave(p,normalize(vec2(1.,.28)),.24,.52,.88,t);
  h+=wave(p,normalize(vec2(.62,-.78)),.31,.37,.73,t);
  h+=wave(p,normalize(vec2(-.34,-1.)),.18,.29,.58,t);
  h+=wave(p,normalize(vec2(.92,.66)),.48,.12,1.12,t);
  h+=wave(p,normalize(vec2(-.8,.3)),.72,.055,1.48,t);
  h+=wave(p,normalize(vec2(.18,-1.)),1.12,.022,1.95,t);
  return h;
 }
 vec3 skyColor(vec3 rd){
  float y=max(rd.y,0.);
  vec3 sky=mix(vec3(.72,.82,.84),vec3(.24,.48,.61),pow(y,.65));
  vec3 sunDir=normalize(vec3(.46,.35,-.82));
  float sun=pow(max(dot(rd,sunDir),0.),180.);
  float halo=pow(max(dot(rd,sunDir),0.),12.);
  sky+=vec3(1.,.72,.43)*sun*.9+vec3(1.,.75,.53)*halo*.18;
  return sky;
 }
 void main(){
  vec2 p=(gl_FragCoord.xy-.5*resolution)/resolution.y;
  vec3 ro=vec3(0.,1.25,5.2);
  vec3 rd=normalize(vec3(p.x*1.55,p.y*1.08-.145,-1.75));
  if(rd.y>-.008){gl_FragColor=vec4(skyColor(rd),1.);return;}
  float t=ro.y/(-rd.y);
  t=clamp(t,0.,180.);
  vec3 pos=ro+rd*t;
  for(int i=0;i<9;i++){
   float f=pos.y-ocean(pos.xz,time);
   float ex=.012;
   float gx=(ocean(pos.xz+vec2(ex,0.),time)-ocean(pos.xz-vec2(ex,0.),time))/(2.*ex);
   float gz=(ocean(pos.xz+vec2(0.,ex),time)-ocean(pos.xz-vec2(0.,ex),time))/(2.*ex);
   float derivative=rd.y-gx*rd.x-gz*rd.z;
   t-=f/(abs(derivative)<.08?(derivative<0.?-.08:.08):derivative);
   t=clamp(t,0.,180.);
   pos=ro+rd*t;
  }
  if(t>175.){gl_FragColor=vec4(skyColor(rd),1.);return;}
  float e=.035+ t*.0015;
  float h=ocean(pos.xz,time);
  float hx=ocean(pos.xz+vec2(e,0.),time)-ocean(pos.xz-vec2(e,0.),time);
  float hz=ocean(pos.xz+vec2(0.,e),time)-ocean(pos.xz-vec2(0.,e),time);
  vec3 n=normalize(vec3(-hx/(2.*e)*1.7,1.,-hz/(2.*e)*1.7));
  vec3 light=normalize(vec3(-.42,.72,.55));
  vec3 view=normalize(ro-pos);
  float diffuse=max(dot(n,light),0.);
  float fresnel=pow(1.-max(dot(n,view),0.),4.);
  float spec=pow(max(dot(reflect(-light,n),view),0.),96.);
  float distanceFade=clamp(t/95.,0.,1.);
  vec3 deep=vec3(.012,.105,.16);
  vec3 shallow=vec3(.025,.30,.36);
  vec3 water=mix(shallow,deep,distanceFade*.82);
  water*=.34+diffuse*.92;
  float rollingFace=smoothstep(-.18,.34,h);
  water=mix(water,water*vec3(.62,.79,.84),rollingFace*.42);
  water+=vec3(.12,.28,.31)*spec*1.6;
  water=mix(water,skyColor(reflect(-view,n)),fresnel*.62);
  float slope=length(vec2(hx,hz));
  float crest=smoothstep(.30,.68,slope);
  float peak=smoothstep(.02,.30,h);
  float breakup=sin(pos.x*1.7+pos.z*.83+time*.34)
              *sin(pos.z*1.23-pos.x*.61-time*.27);
  float foamMask=crest*peak*smoothstep(-.30,.42,breakup);
  float foamDetail=sin(pos.x*7.3+pos.z*4.1+time*.8)
                  *sin(pos.z*6.2-pos.x*3.4-time*.65);
  float foam=foamMask*(.58+.22*foamDetail)*(1.-distanceFade*.42);
  water=mix(water,vec3(.82,.91,.91),clamp(foam,0.,.88));
  float faceShade=smoothstep(-.34,.22,h);
  water*=.88+.12*faceShade;
  float sunGlint=pow(max(dot(reflect(-light,n),view),0.),180.);
  water+=vec3(1.,.83,.62)*sunGlint*.7;
  float haze=smoothstep(35.,125.,t);
  water=mix(water,vec3(.29,.51,.57),haze*.5);
  gl_FragColor=vec4(water,1.);
 }
 `;
 function shader(type,src){
  const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(sh));return null;}return sh;
 }
 const vs=shader(gl.VERTEX_SHADER,vertex),fs=shader(gl.FRAGMENT_SHADER,fragment);
 if(!vs||!fs)return;
 const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(program));return;}
 gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const res=gl.getUniformLocation(program,'resolution'),tm=gl.getUniformLocation(program,'time');
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function resize(){
  const d=Math.min(window.devicePixelRatio||1,1.5),w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);
  canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(res,canvas.width,canvas.height);
 }
 if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);
 resize();
 let start=performance.now();
 function draw(now){
  gl.uniform1f(tm,reduce?0:(now-start)*.00032);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
})();
</script>
