<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<header class="top"><a class="brand" href="kingdoms.html">KAEVORYN STUDIOS<small>CREATE THE IMPOSSIBLE</small></a><a href="kingdoms.html">← The Kingdoms of Wonder</a></header>
<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script>
(()=>{
const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d',{alpha:false});
if(!ctx)return;
const water=document.createElement('canvas'),wctx=water.getContext('2d');
let w=0,h=0,dpr=1,raf=0,last=0,frame=null,pixels=null;
function resize(){
 const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.5);
 w=Math.max(1,r.width);h=Math.max(1,r.height);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 water.width=Math.max(160,Math.round(w*.62));
 water.height=Math.max(180,Math.round(h*.62));
 frame=wctx.createImageData(water.width,water.height);pixels=frame.data;
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);
resize();
function draw(ms){
 raf=requestAnimationFrame(draw);
 if(ms-last<33)return;last=ms;
 const t=ms*.001;
 const horizon=h*.43,wh=water.height,ww=water.width;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#8bbdce');sky.addColorStop(.68,'#c5dfe0');sky.addColorStop(1,'#83b5bf');
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+2);
 const sun=ctx.createRadialGradient(w*.67,horizon*.06,1,w*.67,horizon*.06,w*.42);
 sun.addColorStop(0,'rgba(255,246,218,.42)');sun.addColorStop(1,'rgba(255,246,218,0)');
 ctx.fillStyle=sun;ctx.fillRect(0,0,w,horizon);
 const lightX=w*.67;
 // Shade every water pixel from several crossing wave fields. This creates
 // continuous moving light and dark faces instead of drawn wave outlines.
 for(let py=0;py<wh;py++){
  const depth=py/(wh-1),y=horizon+depth*(h-horizon);
  const row=py*ww*4;
  for(let px=0;px<ww;px++){
   const x=px/ww*w;
   const fade=.28+depth*.95;
   const a1=x*.014+y*.021+t*1.05;
   const a2=x*.008-y*.032-t*.78;
   const a3=x*.027+y*.009-t*1.42;
   const a4=x*.043-y*.018+t*1.9;
   const heightWave=Math.sin(a1)*(1+depth*9)+Math.sin(a2)*(1+depth*6)*.62+Math.sin(a3)*(1+depth*3)*.22+Math.sin(a4)*(1+depth*1.5)*.1;
   const dx=Math.cos(a1)*.014*(1+depth*9)+Math.cos(a2)*.008*(1+depth*6)*.62+Math.cos(a3)*.027*(1+depth*3)*.22+Math.cos(a4)*.043*(1+depth*1.5)*.1;
   const dy=Math.cos(a1)*.021*(1+depth*9)-Math.cos(a2)*.032*(1+depth*6)*.62+Math.cos(a3)*.009*(1+depth*3)*.22-Math.cos(a4)*.018*(1+depth*1.5)*.1;
   const nx=-dx*2.4,ny=-dy*2.4,nz=1;
   const inv=1/Math.sqrt(nx*nx+ny*ny+nz*nz);
   const ndl=Math.max(0,(nx*.22+ny*-.48+nz*.85)*inv);
   const spec=Math.pow(Math.max(0,(nx*.34+ny*-.56+nz*.76)*inv),30);
   const crest=Math.max(0,heightWave-(2.8+depth*3.5));
   const foam=Math.min(.24,crest*.018)*depth;
   const reflection=Math.exp(-Math.pow((x-lightX)/(w*(.018+depth*.19)),2))*(.08+depth*.32)*(0.35+spec*1.8);
   const texture=(Math.sin(px*12.31+py*7.17+t*2.1)*Math.sin(px*3.7-py*9.1-t))*.012*depth;
   const baseR=12+depth*2,baseG=82-depth*38,baseB=103-depth*35;
   const light=(ndl-.45)*17+spec*125+reflection*105+texture*255;
   const idx=row+px*4;
   pixels[idx]=Math.max(0,Math.min(255,baseR+light*.24+foam*190));
   pixels[idx+1]=Math.max(0,Math.min(255,baseG+light*.72+foam*210));
   pixels[idx+2]=Math.max(0,Math.min(255,baseB+light+foam*205));
   pixels[idx+3]=255;
  }
 }
 wctx.putImageData(frame,0,0);
 ctx.imageSmoothingEnabled=true;
 ctx.drawImage(water,0,horizon,w,h-horizon);
 // Fine, broken glints ride on the moving wave field, not on fixed lines.
 for(let i=0;i<95;i++){
  const depth=(i%19)/18,y=horizon+18+depth*depth*(h-horizon-18);
  const spread=5+depth*depth*w*.18;
  const x=lightX+Math.sin(i*13.7+t*(.7+depth))*spread+Math.sin(i*4.3-t*.8)*8;
  const length=(1+depth*9)*(.25+Math.abs(Math.sin(i*2.3+t*2))*.8);
  const alpha=(.035+depth*.13)*(.3+Math.abs(Math.sin(i*5.1+t))*.7);
  ctx.beginPath();ctx.moveTo(x-length,y);
  ctx.quadraticCurveTo(x,y-1-depth,x+length,y);
  ctx.strokeStyle='rgba(255,242,211,'+alpha+')';ctx.lineWidth=.5+depth*.7;ctx.stroke();
 }
}
raf=requestAnimationFrame(draw);
})();
</script>
</body></html>
