*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07354a;color:#f4fbff;font:15px/1.5 Arial,sans-serif}body{overflow-x:hidden}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#03283acc,transparent)}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#a9efff;font-size:9px}.top a:last-child{color:#e4faff;text-decoration:none;font-size:12px}.stage{height:100svh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(#8bc8dc 0%,#c3e3e7 36%,#398da5 62%,#07506b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.heading{position:absolute;z-index:2;top:17%;left:0;right:0;text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 3px 18px #07354a88}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.25em;color:#e4fbff}.heading h1{font-size:clamp(38px,7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}.heading p{max-width:520px;margin:12px auto;color:#f0fcff;font-size:clamp(14px,2vw,17px)}.foot{position:absolute;z-index:2;bottom:14px;left:0;right:0;text-align:center;color:#e1f8ff;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 8px #001d2b}.foot a{color:#fff}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<main><section class="stage" aria-label="Open ocean water preview"><canvas id="ocean" aria-hidden="true"></canvas><div class="heading"><div class="eyebrow">THE KINGDOMS OF WONDER · WATER ADVENTURE</div><h1>THE SEA OF WONDERS</h1><p>First, we build the ocean. Nothing else — just open water, natural waves, and a distant horizon.</p></div><div class="foot">KAEVORYN STUDIOS · <a href="kingdoms.html">RETURN TO THE PARK</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const canvas=document.getElementById('ocean');
if(!window.THREE)return;
const THREE=window.THREE,scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bcbd9);
scene.fog=new THREE.Fog(0x9bcbd9,95,270);
const camera=new THREE.PerspectiveCamera(54,1,.1,600);
camera.position.set(0,8,24);camera.lookAt(0,0,-45);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xe8faff,0x17465a,1.35));
const sunlight=new THREE.DirectionalLight(0xfff4df,2.0);sunlight.position.set(-35,45,20);scene.add(sunlight);
const geometry=new THREE.PlaneGeometry(420,520,320,380);geometry.rotateX(-Math.PI/2);
const base=geometry.attributes.position.array.slice();
const colors=new Float32Array(geometry.attributes.position.count*3);
geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
const deep=new THREE.Color(0x032f4b),blue=new THREE.Color(0x05658a),aqua=new THREE.Color(0x20a0b2),foam=new THREE.Color(0xe5f4ed),sunGlint=new THREE.Color(0xfff4d8);
const material=new THREE.MeshPhysicalMaterial({color:0xffffff,vertexColors:true,roughness:.115,metalness:.09,clearcoat:1,clearcoatRoughness:.035,reflectivity:1});
const water=new THREE.Mesh(geometry,material);water.position.set(0,-.5,-105);scene.add(water);
function waveAt(x,z,t){
 const swell=Math.sin(x*.025+t*.34)*.30+
 Math.sin((x*.62+z)*.019-t*.29)*.36+
 Math.cos(z*.033+t*.25)*.19;
 const cross=Math.sin((x*.8-z)*.075+t*.72)*.065+
 Math.sin((x+z)*.14-t*.94)*.025;
 return swell+cross;
}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),p=geometry.attributes.position,c=geometry.attributes.color;
for(let i=0;i<p.count;i++){const x=base[i*3],z=base[i*3+2];const wave=waveAt(x,z,t);p.setY(i,base[i*3+1]+wave);const distance=THREE.MathUtils.smoothstep(z,-255,-8);const crest=THREE.MathUtils.smoothstep(wave,.49,.72);const chop=Math.abs(Math.sin((x*.8-z)*.075+t*.72));const foamMask=Math.max(crest*.62,THREE.MathUtils.smoothstep(chop,.985,1)*.16);const bandCenter=-22+Math.sin(z*.022+t*.35)*5;const band=Math.exp(-Math.pow((x-bandCenter)/5.2,2));const glimmer=(.35+.65*Math.sin(z*.31+t*2.1)**8)*band*.58;const col=deep.clone().lerp(blue,distance*.86).lerp(aqua,distance*.24).lerp(sunGlint,glimmer).lerp(foam,foamMask);c.setXYZ(i,col.r,col.g,col.b);}
p.needsUpdate=true;c.needsUpdate=true;geometry.computeVertexNormals();
renderer.render(scene,camera);}
animate();
})();
</script>
