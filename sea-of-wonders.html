<style>
:root{color-scheme:dark;--foam:#d9fff7;--aqua:#51d5cc;--deep:#073b58}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#092d43;color:#f5fbff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.scene{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(180deg,#263f60 0%,#d28d79 19%,#f0bd91 34%,#498a9a 47%,#07516e 100%)}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.skyglow{position:absolute;width:min(34vw,440px);aspect-ratio:1;left:53%;top:8%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe6b6 0%,#f7c99a 20%,#e8a68e 39%,#d78f87 54%,transparent 72%);filter:blur(4px);opacity:.92}
.heading{position:absolute;z-index:5;top:10%;left:0;right:0;text-align:center;padding:0 18px;text-shadow:0 3px 22px #092c45aa;pointer-events:none}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.28em;color:#f4e6d7}
h1{font-size:clamp(36px,6.7vw,76px);line-height:.98;letter-spacing:-.045em;margin:12px 0;color:#fff}
.heading p{font-size:clamp(13px,1.7vw,17px);margin:12px auto;color:#fff5eb;max-width:540px}
.top{position:absolute;z-index:8;top:0;left:0;right:0;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#061d32aa,transparent)}
.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:white;text-decoration:none}.brand small{display:block;color:#b8e9f0;font-size:9px;margin-top:3px}
.top a:last-child,.foot a{color:#fff;text-decoration:none;font-size:12px}
.foot{position:absolute;z-index:8;bottom:15px;left:0;right:0;text-align:center;color:#e9f9f8;font-size:10px;letter-spacing:.16em;text-shadow:0 2px 10px #001a2a}
.wave{animation:drift 18s linear infinite}.wave.w2{animation-duration:26s;animation-direction:reverse}.wave.w3{animation-duration:34s}
.water-shimmer{animation:shimmer 5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes shimmer{from{opacity:.22}to{opacity:.62}}
@media(max-width:650px){.heading{top:13%}.heading p{max-width:310px}.skyglow{width:66vw;top:12%;left:57%}.top{padding:14px 15px}.top a:last-child{font-size:10px}.brand{font-size:9px}.brand small{font-size:8px}.foot{font-size:9px}}
@media(prefers-reduced-motion:reduce){.wave,.water-shimmer{animation:none}}
</style>
</head>
