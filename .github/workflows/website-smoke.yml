name: Website smoke checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "content/**"
      - "projects/**"
      - "scripts/website_smoke_test.py"
      - "scripts/website_browser_test.py"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: HTML structure and inline JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run website smoke tests
        run: python scripts/website_smoke_test.py

  browser-test:
    name: Responsive browser and invitation interactions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: python scripts/website_browser_test.py
