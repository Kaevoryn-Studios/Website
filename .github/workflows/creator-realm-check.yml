name: Creator's Realm prototype checks

on:
  pull_request:
    branches: [main]
    paths:
      - "creator-realm/**"
      - "scripts/creator_realm_browser_test.py"
      - ".github/workflows/creator-realm-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    name: Creator's Realm responsive interaction checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Creator's Realm browser checks
        run: python scripts/creator_realm_browser_test.py
