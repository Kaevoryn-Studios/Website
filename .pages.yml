media:
  input: media
  output: /media

content:
  - name: site
    label: Website Content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: home
        label: Home
        type: object
        fields:
          - name: kicker
            label: Kicker
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: Subtitle
            type: string
          - name: description
            label: Description
            type: text
          - name: question
            label: Question
            type: string

      - name: vision
        label: Vision
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Title
            type: string
          - name: philosophy
            label: Philosophy
            type: text
          - name: description
            label: Description
            type: text

      - name: golden
        label: Golden Invitation
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
          - name: label
            label: Invitation Label
            type: string
          - name: invitation
            label: Invitation Title
            type: string
          - name: access
            label: Access Text
            type: string
          - name: create
            label: Create Text
            type: string
          - name: quote
            label: Quote
            type: text
          - name: dreamer
            label: Dreamer Access
            type: string
          - name: hidden
            label: Hidden Message
            type: string

      - name: contact
        label: Connect
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text

      - name: footer
        label: Footer
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: slogan
            label: Slogan
            type: string

  - name: projects
    label: Worlds & Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: category
        label: Category
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: status
        label: Official Status
        type: string
      - name: slug
        label: Project Page Slug
        type: string
      - name: image
        label: Image
        type: image

settings:
  content:
    merge: true